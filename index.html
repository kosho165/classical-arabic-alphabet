<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعلم الحروف العربية - classical-arabic-alphabet.netlify.app</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: row-reverse; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f4ff; }
        .split-left { flex: 1; overflow: hidden; }
        .split-left img { width: 100%; height: 100%; object-fit: cover; }
        .split-right { flex: 1; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; border: 2px solid #e9d5ff; border-radius: 20px; padding: 40px 30px; width: 85%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(147, 51, 234, 0.05); }
        .logo-img { width: 130px; border-radius: 25px; margin-bottom: 20px; }
        .login-card h2 { color: #6b21a8; margin: 0 0 5px 0; font-size: 1.6em; }
        .login-card p.en-title { color: #6b7280; font-size: 0.7em; margin: 0 0 30px 0; }
        .input-field { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #d8b4fe; border-radius: 10px; font-size: 1em; text-align: center; box-sizing: border-box; outline: none; color: #4b5563; }
        .input-field::placeholder { color: #9ca3af; }
        .start-btn { background-color: #9333ea; color: white; width: 100%; padding: 15px; border: none; border-radius: 30px; font-size: 1.3em; cursor: pointer; margin-top: 15px; transition: 0.3s; line-height: 1.2; }
        .start-btn:hover { background-color: #7e22ce; }
        .start-btn span { display: block; font-size: 0.6em; font-weight: normal; margin-top: 5px; opacity: 0.9; }
        .error-msg { color: #ef4444; font-size: 0.9em; margin-top: 15px; display: none; font-weight: bold; }
        .error-msg span { display: block; font-size: 0.8em; font-weight: normal; }
        .footer-credit { margin-top: 30px; font-size: 0.85em; font-weight: bold; color: #a855f7; }
        @media (max-width: 768px) { body { flex-direction: column; } .split-left { flex: none; height: 35vh; } .split-right { height: 65vh; padding: 20px; } }
    </style>
</head>
<body>

    <div class="split-left">
        <img src="images/family.png" alt="عائلة تتعلم">
    </div>

    <div class="split-right">
        <div class="login-card">
            <img src="images/logo.jpg" class="logo-img" alt="Logo">
            <h2>أهلاً بك في تطبيق الحروف</h2>
            <p class="en-title">Welcome to Alphabet App</p>

            <input type="text" id="studentName" class="input-field" placeholder="الاسم (Name)" required>
            <input type="email" id="studentEmail" class="input-field" placeholder="الإيميل (Email)" required>

            <button class="start-btn" onclick="saveDataAndStart()">
                ابدأ التعلم
                <span>Start Learning</span>
            </button>
            
            <p id="error-msg" class="error-msg">من فضلك أدخل الاسم والإيميل<span>Please enter your name and email</span></p>
            
            <div class="footer-credit">Created by : Hisham Embaby</div>
        </div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBNF8mnf0ucVbAbuZojokGSKNnUvQNvoGk",
            authDomain: "hisham-s-english-academy.firebaseapp.com",
            projectId: "hisham-s-english-academy",
            storageBucket: "hisham-s-english-academy.firebasestorage.app",
            messagingSenderId: "766824698161",
            appId: "1:766824698161:web:aeb8d7ab371912e7aee010"
        };
        
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        function saveDataAndStart() {
            var name = document.getElementById('studentName').value;
            var email = document.getElementById('studentEmail').value;

            if(name === "" || email === "") {
                document.getElementById('error-msg').style.display = "block";
                return;
            }

            db.collection("alphabet_students").add({
                name: name,
                email: email,
                course: "Arabic Alphabet",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                // ده السطر اللي اتصلح عشان ينقلك للحروف
                window.location.href = 'letters.html';
            })
            .catch((error) => {
                console.error("Error: ", error);
                window.location.href = 'letters.html';
            });
        }
    </script>
</body>
</html>
